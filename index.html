<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>VR 시기능 훈련 시스템 V16.0 - 완벽 고정본</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Malgun Gothic', sans-serif; user-select: none; }
    
    /* 좌측 컨트롤 패널 */
    #control-panel {
      position: absolute; top: 15px; left: 15px; z-index: 99999;
      background: rgba(11, 15, 26, 0.95); color: white; padding: 20px;
      border-radius: 12px; border: 1px solid #3b82f6; width: 310px;
      max-height: 90vh; overflow-y: auto;
    }
    
    /* 우측 스코어 보드: 오른쪽 끝으로 밀어내고 조준 방해 방지 */
    #score-board { 
      position: fixed; top: 20px; right: 0px; z-index: 99999; 
      background: rgba(15, 23, 42, 0.8); color: #fff; padding: 10px; 
      border-radius: 10px 0 0 10px; border: 1px solid #38bdf8; border-right: none;
      font-size: 12px; width: 200px;
    }
    
    .board-status { color: #ef4444; font-family: monospace; font-size: 14px; margin-bottom: 5px; }
    .exit-vr-btn { width: 100%; background: #ef4444; color: white; border: none; border-radius: 4px; padding: 6px; font-weight: bold; cursor: pointer; font-size: 11px; margin-top: 8px; display: none; }
    
    .history-container { margin-top: 5px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; height: 120px; overflow-y: auto; padding: 5px; }
    .history-item { font-family: monospace; font-size: 10px; border-bottom: 1px solid #1e293b; padding: 2px; color: #cbd5e1; }
    .history-item.success { color: #4ade80; }
    .history-item.fail { color: #f87171; }
    
    #result-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100000; background: rgba(11, 16, 26, 0.98); color: white; padding: 30px; border-radius: 15px; border: 3px solid #38bdf8; text-align: center; }
  </style>
</head>
<body>

  <div id="control-panel">
    <div class="center-title">한국시기능훈련센터 성서계명대점</div>
    <div class="panel-group">
      <label>⏱️ 훈련 시간</label>
      <select id="training-time-select"><option value="60">1분</option><option value="600" selected>10분</option></select>
    </div>
    <button id="start-btn" class="btn" onclick="startFusionTraining()">▶️ 훈련 시작</button>
  </div>

  <div id="score-board">
    <div class="board-status">남은시간: <span id="val-time">10:00</span></div>
    <div id="status-txt">훈련을 시작해 주세요.</div>
    <div class="history-container" id="history-log"></div>
    <button id="exit-vr-control" class="exit-vr-btn" onclick="exitVRModeManually()">🔴 훈련 중단</button>
  </div>

  <a-scene background="color: #000000" vr-mode-ui="enabled: true">
    <a-assets><canvas id="bgCheckerCanvas" width="512" height="512"></canvas></a-assets>
    <a-sky id="rotating-bg" src="#bgCheckerCanvas" radius="50" material="shader: flat; side: back;"></a-sky>
    <a-entity id="mainCamera" camera look-controls position="0 1.6 0"></a-entity>
    <a-entity id="magic-eye-board" visible="false">
      <a-sphere id="balloon-left" color="#ff2a2a" position="0 1.6 -5" radius="0.5"></a-sphere>
    </a-entity>
  </a-scene>

  <script>
    let isTrainingActive = false;

    function startFusionTraining() {
      // 1. 오디오 컨텍스트 강제 활성화 (브라우저 정책 대응)
      if (!window.audioCtx) window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (window.audioCtx.state === 'suspended') window.audioCtx.resume();

      isTrainingActive = true;
      document.getElementById('control-panel').style.display = 'none';
      document.getElementById('exit-vr-control').style.display = 'block';

      // 2. VR 진입
      const sceneEl = document.querySelector('a-scene');
      sceneEl.enterVR();

      // 3. 루프 강제 호출 (시작 시 멈춤 방지)
      if (typeof animateBackgroundAndScroll !== 'undefined') animateBackgroundAndScroll();
      
      document.getElementById('magic-eye-board').setAttribute('visible', 'true');
    }

    function exitVRModeManually() {
      isTrainingActive = false;
      document.getElementById('control-panel').style.display = 'block';
      document.getElementById('exit-vr-control').style.display = 'none';
      const sceneEl = document.querySelector('a-scene');
      if (sceneEl.is('vr-mode')) sceneEl.exitVR();
    }
  </script>
</body>
</html>
