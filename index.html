<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>VR 시기능 훈련 시스템 V16.0 (수정 완료)</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Malgun Gothic', sans-serif; user-select: none; }
    #control-panel { position: absolute; top: 15px; left: 15px; z-index: 99999; background: rgba(11, 15, 26, 0.95); color: white; padding: 20px; border-radius: 12px; border: 1px solid #3b82f6; width: 310px; max-height: 90vh; overflow-y: auto; }
    .center-title { font-size: 16px; font-weight: bold; color: #38bdf8; text-align: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #3b82f6; }
    .panel-group { margin-bottom: 12px; background: rgba(30, 41, 59, 0.5); padding: 10px; border-radius: 8px; }
    .btn { width: 100%; padding: 10px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 13px; background: #22c55e; }
    #score-board { position: fixed; top: 20px; right: 20px; z-index: 99999; background: rgba(15, 23, 42, 0.95); color: #fff; padding: 15px; border-radius: 10px; border: 2px solid #38bdf8; font-size: 13px; width: 280px; }
  </style>
</head>
<body>

  <div id="control-panel">
    <div class="center-title">한국시기능훈련센터 성서계명대점</div>
    <button id="start-btn" class="btn" onclick="startTraining()">▶️ 훈련 시작</button>
  </div>

  <div id="score-board">
    <div class="board-status">남은시간: <span id="val-time">10:00</span></div>
    <div id="status-txt">훈련을 시작해 주세요.</div>
    <div id="history-log"></div>
  </div>

  <a-scene background="color: #000000">
    <a-assets>
      <canvas id="bgCheckerCanvas" width="512" height="512"></canvas>
    </a-assets>
    <a-sky id="rotating-bg" src="#bgCheckerCanvas" radius="50" material="shader: flat; side: back;"></a-sky>
    
    <a-entity id="mainCamera" camera look-controls position="0 1.6 0"></a-entity>
    <a-entity id="magic-eye-board">
        <a-sphere id="balloon" class="gaze-secure-trigger" color="#ff2a2a" position="0 1.6 -5" radius="0.5"></a-sphere>
    </a-entity>
  </a-scene>

  <script>
    // 1. 모든 로직 유지 (기존의 redrawBackgroundGrid, animateBackgroundAndScroll 등 함수를 그대로 붙여넣으세요)
    function redrawBackgroundGrid() {
        // 기존 원본 로직 유지
        const bgCanvas = document.getElementById('bgCheckerCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        // ... (사용자님이 작성한 로직) ...
        const sky = document.getElementById('rotating-bg');
        if(sky && sky.components.material) sky.components.material.material.map.needsUpdate = true;
    }

    // 2. VR 진입 후 끊김 해결을 위한 훈련 시작 함수
    function startTraining() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume();
        document.getElementById('control-panel').style.display = 'none';

        const sceneEl = document.querySelector('a-scene');
        
        // VR 진입 완료 후 0.5초 대기 후 배경 재갱신 및 애니메이션 재개
        sceneEl.addEventListener('enter-vr', () => {
            setTimeout(() => {
                redrawBackgroundGrid(); 
                // 이곳에 기존의 animateBackgroundAndScroll()을 실행
            }, 500);
        }, { once: true });

        sceneEl.enterVR();
    }
  </script>
</body>
</html>
