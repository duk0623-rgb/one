<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>VR 시기능 훈련 시스템 V16.0 - 완벽 통합본</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; user-select: none; }
    #control-panel { position: absolute; top: 15px; left: 15px; z-index: 99999; background: rgba(11, 15, 26, 0.95); color: white; padding: 20px; border-radius: 12px; border: 1px solid #3b82f6; width: 310px; }
    .btn { width: 100%; padding: 12px; background: #22c55e; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 6px; }
  </style>
</head>
<body>

  <div id="control-panel">
    <h3>한국시기능훈련센터 성서계명대점</h3>
    <button class="btn" onclick="startTraining()">▶️ 훈련 시작</button>
  </div>

  <a-scene id="scene" background="color: #000000">
    <a-assets>
      <canvas id="bgCheckerCanvas" width="512" height="512"></canvas>
    </a-assets>

    <a-sky id="rotating-bg" src="#bgCheckerCanvas" radius="50" material="shader: flat; side: back;"></a-sky>

    <a-entity camera look-controls position="0 1.6 0">
      <a-entity id="ray" raycaster="objects: .target; far: 20;" cursor="rayOrigin: entity" position="0 0 -1"></a-entity>
    </a-entity>

    <a-sphere id="balloon" class="target" color="#ff2a2a" position="0 1.6 -5" radius="0.5"></a-sphere>
  </a-scene>

  <script>
    let rotY = 0;
    
    // 1. 배경 격자 그리기
    function drawGrid() {
      const canvas = document.getElementById('bgCheckerCanvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#FFF';
      for(let i=0; i<8; i++) for(let j=0; j<8; j++) if((i+j)%2===0) ctx.fillRect(i*64, j*64, 64, 64);
      
      const sky = document.getElementById('rotating-bg');
      if(sky.components.material) sky.components.material.material.map.needsUpdate = true;
    }

    // 2. 훈련 시작 및 VR 진입
    function startTraining() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
      
      document.getElementById('control-panel').style.display = 'none';
      const scene = document.querySelector('a-scene');
      scene.enterVR();
    }

    // 3. 루프 실행 (A-Frame의 렌더링 루프에 안전하게 연결)
    function updateLoop() {
      rotY += 0.2;
      const sky = document.getElementById('rotating-bg');
      if(sky) sky.setAttribute('rotation', `0 ${rotY} 0`);
      
      // 풍선 주시 확인
      const ray = document.getElementById('ray');
      if(ray && ray.components.raycaster.intersections.length > 0) {
        // 풍선 터짐 로직
        const balloon = document.getElementById('balloon');
        balloon.setAttribute('position', `${(Math.random()-0.5)*4} ${1.6+(Math.random()-0.5)} -5`);
      }
      requestAnimationFrame(updateLoop);
    }

    // 초기화
    window.onload = () => {
      drawGrid();
      updateLoop();
    };
  </script>
</body>
</html>
