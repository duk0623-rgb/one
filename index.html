<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>VR 시기능 훈련 시스템 V19.3 (실시간 카운터 통합판)</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Malgun Gothic', sans-serif; user-select: none; }
    #setup-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #070a12; color: #38bdf8; z-index: 999999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
    .setup-box { width: 100%; max-width: 400px; background: #0b0f1a; border: 2px solid #3b82f6; border-radius: 12px; padding: 25px; box-sizing: border-box; box-shadow: 0 0 25px rgba(56, 189, 248, 0.2); overflow-y: auto; max-height: 90vh; }
    .center-info { font-size: 11px; color: #94a3b8; text-align: center; margin-bottom: 2px; }
    .center-title { font-size: 16px; font-weight: bold; color: #38bdf8; text-align: center; margin-bottom: 20px; padding-bottom: 8px; border-bottom: 2px solid #3b82f6; }
    .panel-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; font-weight: bold; }
    select, input[type="range"] { width: 100%; padding: 8px; background: #1e293b; color: white; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
    .display-value { float: right; color: #38bdf8; font-weight: bold; }
    .start-btn { width: 100%; padding: 15px; background: #22c55e; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4); }
  </style>
  <script>
    AFRAME.registerComponent('stereo-eye-lock', {
      schema: { eye: {type: 'string', default: 'both'} },
      init: function () {
        this.layerMask = (this.data.eye === 'left') ? 1 : (this.data.eye === 'right' ? 2 : 0);
        this.el.addEventListener('object3dset', () => { this.applyLayer(); });
        this.applyLayer();
      },
      applyLayer: function () {
        const obj = this.el.getObject3D('mesh') || this.el.object3D;
        if (obj) {
          obj.layers.set(this.layerMask);
          obj.traverse(child => { if(child.layers) child.layers.set(this.layerMask); });
        }
      }
    });
    AFRAME.registerComponent('vr-loop-manager', {
      tick: function (time, timeDelta) {
        if (typeof window.checkTargetGazeIntersectionInternal === 'function') window.checkTargetGazeIntersectionInternal();
        if (typeof window.animateBackgroundScrollInternal === 'function') window.animateBackgroundScrollInternal();
      }
    });
  </script>
</head>
<body>

  <div id="setup-container">
    <div class="setup-box">
      <div class="center-info">시기능 시지각 전문 훈련 기관</div>
      <div class="center-title">한국시기능훈련센터 성서계명대점</div>
      
      <div class="panel-group">
        <label>🎮 구동 모드 선택</label>
        <select id="run-mode-select" onchange="toggleRunModeUI(this.value)">
          <option value="manual" selected>수동 모드 (방향 직접 지정)</option>
          <option value="auto">자동 모드 (순환 방향 전환)</option>
        </select>
      </div>

      <div class="panel-group" id="manual-dir-group">
        <label>🗺️ 배경 이동 방향 지정 (수동)</label>
        <select id="manual-dir-select">
          <option value="right" selected>우측 이동</option>
          <option value="left">좌측 이동</option>
          <option value="up">상측 이동</option>
          <option value="down">하측 이동</option>
          <option value="clockwise">시계방향 회전</option>
          <option value="counterclockwise">반시계방향 회전</option>
        </select>
      </div>

      <div class="panel-group" id="auto-interval-group" style="display: none;">
        <label>🔄 자동 전환 주기 설정</label>
        <select id="auto-interval-select">
          <option value="120" selected>2분 단위 전환</option>
          <option value="180">3분 단위 전환</option>
        </select>
      </div>

      <div class="panel-group">
        <label>👁️ 안구 선택 모드</label>
        <select id="eye-select">
          <option value="alternating" selected>교대 출현 (OU)</option>
          <option value="leftOnly">왼쪽 눈 전용 (L-양안격리)</option>
          <option value="rightOnly">오른쪽 눈 전용 (R-양안격리)</option>
        </select>
      </div>

      <div class="panel-group">
        <label>🏁 배경 격자 크기 <span class="display-value" id="grid-txt">4</span></label>
        <input type="range" id="grid-slider" min="1" max="12" value="4" step="1" oninput="document.getElementById('grid-txt').innerText=this.value;">
      </div>

      <div class="panel-group">
        <label>↔️ 풍선 출현 반경 <span class="display-value" id="range-txt">1.40</span></label>
        <input type="range" id="range-slider" min="0.50" max="2.40" value="1.40" step="0.10" oninput="document.getElementById('range-txt').innerText=parseFloat(this.value).toFixed(2);">
      </div>

      <div class="panel-group" id="speed-control-group">
        <label>🔄 배경 회전 속도 <span class="display-value" id="speed-txt">4</span></label>
        <input type="range" id="speed-slider" min="0" max="60" value="4" step="1" oninput="document.getElementById('speed-txt').innerText=this.value; rotationSpeed=parseInt(this.value);">
      </div>

      <button class="start-btn" onclick="startSingleVRTraining()">⚙️ 세팅 완료 및 VR 훈련 시작</button>
    </div>
  </div>

  <a-scene id="vr-scene" background="color: #000000" vr-mode-ui="enabled: true" vr-loop-manager>
    <a-assets><canvas id="bgCheckerCanvas" width="512" height="512"></canvas></a-assets>
    <a-sky id="rotating-bg" src="#bgCheckerCanvas" radius="50" material="shader: flat; repeat: 16 16; side: back;" stereo-eye-lock="eye: both"></a-sky>
    
    <a-entity id="cameraRig">
      <a-entity id="mainCamera" camera look-controls position="0 1.6 0">
        <a-entity id="centerFixationRay" raycaster="objects: .gaze-secure-trigger; far: 100; interval: 10;"></a-entity>
        
        <a-ring id="gaze-ring-left" radius-inner="0.04" radius-outer="0.06" color="#000000" position="0 0 -1" material="shader: flat; opacity: 1.0; depthTest: false;" stereo-eye-lock="eye: left" visible="false"></a-ring>
        
        <a-ring id="gaze-ring-right" radius-inner="0.04" radius-outer="0.06" color="#000000" position="0 0 -1" material="shader: flat; opacity: 1.0; depthTest: false;" stereo-eye-lock="eye: right" visible="false"></a-ring>

        <a-entity id="hud-left" position="-0.03 0.35 -1" stereo-eye-lock="eye: left" visible="false">
          <a-text id="hud-text-left" value="TIME: 0s\nPOP: 0" color="#38bdf8" align="center" width="1.2" font="khaoan"></a-text>
        </a-entity>
        <a-entity id="hud-right" position="0.03 0.35 -1" stereo-eye-lock="eye: right" visible="false">
          <a-text id="hud-text-right" value="TIME: 0s\nPOP: 0" color="#38bdf8" align="center" width="1.2" font="khaoan"></a-text>
        </a-entity>
      </a-entity>
    </a-entity>

    <a-entity id="magic-eye-board" visible="false">
      <a-entity id="left-eye-container" stereo-eye-lock="eye: left">
        <a-sphere id="balloon-left" color="#ff2a2a"><a-cone id="cone-left" color="#cc1111"></a-cone></a-sphere>
      </a-entity>
      <a-entity id="right-eye-container" stereo-eye-lock="eye: right">
        <a-sphere id="balloon-right" color="#10b981"><a-cone id="cone-right" color="#047857"></a-cone></a-sphere>
      </a-entity>
      <a-entity id="gaze-collision-trigger" class="gaze-secure-trigger" material="visible: false;" stereo-eye-lock="eye: both"></a-entity>
    </a-entity>
    <a-entity id="particle-group"></a-entity>
  </a-scene>

  <script>
    let audioCtx = null;
    let balloonPopCount = 0; 
    let randomRange = 1.40;
    let rotationSpeed = 4;
    let isTrainingActive = false;
    let isPopping = false;
    let elapsedInterval = null;
    let totalSecondsElapsed = 0; 
    let activeTurn = "left"; 
    let currentX = 0, currentY = 1.6, currentZ = -16.0;
    let gazeTimer = null;
    let rotX = 0, rotY = 0, rotZ = 0;
    let rowsCols = 4;
    
    let eyeModeSetting = "alternating";
    let runModeSetting = "manual";
    let manualDirectionSetting = "right";
    let autoChangeInterval = 120; 
    let autoDirectionStep = 0; 
    let autoTimerCounter = 0;

    const sceneEl = document.getElementById('vr-scene');

    function toggleRunModeUI(mode) {
      if(mode === 'auto') {
        document.getElementById('manual-dir-group').style.display = 'none';
        document.getElementById('auto-interval-group').style.display = 'block';
      } else {
        document.getElementById('manual-dir-group').style.display = 'block';
        document.getElementById('auto-interval-group').style.display = 'none';
      }
    }

    function updateHudDisplay() {
      // 분:초 포맷 연산
      let min = Math.floor(totalSecondsElapsed / 60);
      let sec = totalSecondsElapsed % 60;
      let timeStr = `${min}m ${sec}s`;
      let textValue = `⏱️ ${timeStr}\n🎈 POP: ${balloonPopCount}`;
      
      document.getElementById('hud-text-left').setAttribute('value', textValue);
      document.getElementById('hud-text-right').setAttribute('value', textValue);
    }

    function startSingleVRTraining() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      eyeModeSetting = document.getElementById('eye-select').value;
      runModeSetting = document.getElementById('run-mode-select').value;
      rowsCols = parseInt(document.getElementById('grid-slider').value);
      randomRange = parseFloat(document.getElementById('range-slider').value);
      rotationSpeed = parseInt(document.getElementById('speed-slider').value);
      
      if (runModeSetting === "auto") {
        autoChangeInterval = parseInt(document.getElementById('auto-interval-select').value);
      } else {
        manualDirectionSetting = document.getElementById('manual-dir-select').value;
      }

      if (eyeModeSetting === "rightOnly") activeTurn = "right";
      else activeTurn = "left";

      document.getElementById('setup-container').style.display = 'none';
      redrawBackgroundGrid();
      
      isTrainingActive = true;
      document.getElementById('magic-eye-board').setAttribute('visible', 'true');
      renderRandomTargetsOnly();
      
      // 변수 및 HUD 초기화
      totalSecondsElapsed = 0;
      autoTimerCounter = 0;
      autoDirectionStep = 0;
      balloonPopCount = 0;
      updateHudDisplay();

      if (elapsedInterval) clearInterval(elapsedInterval);
      elapsedInterval = setInterval(() => {
        if (!isTrainingActive) return;
        totalSecondsElapsed++;
        
        // 자동 전환 모드 시 주기별 6단계 기하학 순환 연산
        if (runModeSetting === "auto") {
          autoTimerCounter++;
          if (autoTimerCounter >= autoChangeInterval) {
            autoTimerCounter = 0;
            autoDirectionStep = (autoDirectionStep + 1) % 6; 
          }
        }

        // 매초 실시간 HUD 동기화 반영
        updateHudDisplay();
      }, 1000);

      if (sceneEl.hasLoaded) sceneEl.enterVR();
      else sceneEl.addEventListener('loaded', () => sceneEl.enterVR());
    }

    function redrawBackgroundGrid() {
      const bgCanvas = document.getElementById('bgCheckerCanvas');
      const bgCtx = bgCanvas.getContext('2d');
      const bSize = 512;
      const bW = bSize / rowsCols;
      const bH = bSize / rowsCols;
      bgCtx.clearRect(0, 0, bSize, bSize);
      for (let r = 0; r < rowsCols; r++) {
        for (let c = 0; c < rowsCols; c++) {
          bgCtx.fillStyle = ((r + c) % 2 === 0) ? '#FFFFFF' : '#000000';
          bgCtx.fillRect(c * bW, r * bH, bW, bH);
        }
      }
      const sky = document.getElementById('rotating-bg');
      if(sky && sky.components.material && sky.components.material.material && sky.components.material.material.map) {
        sky.components.material.material.map.needsUpdate = true;
      }
    }

    // ★ [절대 가이드 수립] 현재 검은 원 위치와 풍선 좌표 1:1 완벽 추적 융합 배치
    function renderRandomTargetsOnly() {
      if (!isTrainingActive) return;
      
      let camPos = {x: 0, y: 1.6, z: 0};
      let zOffset = 16.0; 
      let baseZ = camPos.z - zOffset;
      let spreadFactor = zOffset / 4.2;
      
      let randX = camPos.x + (Math.random() - 0.5) * (randomRange * 1.3 * spreadFactor);
      let randY = camPos.y + (Math.random() - 0.5) * (randomRange * 1.0 * spreadFactor);
      if (randY < camPos.y - (0.5 * spreadFactor)) randY = camPos.y - (0.5 * spreadFactor);
      if (randY > camPos.y + (0.7 * spreadFactor)) randY = camPos.y + (0.7 * spreadFactor);
      
      currentX = randX; currentY = randY; currentZ = baseZ;

      const ringLeft = document.getElementById('gaze-ring-left');
      const ringRight = document.getElementById('gaze-ring-right');
      const hudL = document.getElementById('hud-left');
      const hudR = document.getElementById('hud-right');
      const cLeft = document.getElementById('left-eye-container');
      const cRight = document.getElementById('right-eye-container');
      const bLeft = document.getElementById('balloon-left');
      const bRight = document.getElementById('balloon-right');
      const secureTrigger = document.getElementById('gaze-collision-trigger');

      // 단안 격리 모드에 의한 HUD 및 검은 원 제어
      if (eyeModeSetting === "leftOnly") {
        activeTurn = "left";
        ringLeft.setAttribute('visible', 'true'); ringRight.setAttribute('visible', 'false');
        hudL.setAttribute('visible', 'true'); hudR.setAttribute('visible', 'false');
        cLeft.setAttribute('visible', 'true'); cRight.setAttribute('visible', 'false');
      } else if (eyeModeSetting === "rightOnly") {
        activeTurn = "right";
        ringLeft.setAttribute('visible', 'false'); ringRight.setAttribute('visible', 'true');
        hudL.setAttribute('visible', 'false'); hudR.setAttribute('visible', 'true');
        cLeft.setAttribute('visible', 'false'); cRight.setAttribute('visible', 'true');
      } else {
        // 교대 모드 시 활성화된 안구에만 정보 로드
        if (activeTurn === "left") {
          ringLeft.setAttribute('visible', 'true'); ringRight.setAttribute('visible', 'false');
          hudL.setAttribute('visible', 'true'); hudR.setAttribute('visible', 'false');
          cLeft.setAttribute('visible', 'true'); cRight.setAttribute('visible', 'false');
        } else {
          ringLeft.setAttribute('visible', 'false'); ringRight.setAttribute('visible', 'true');
          hudL.setAttribute('visible', 'false'); hudR.setAttribute('visible', 'true');
          cLeft.setAttribute('visible', 'false'); cRight.setAttribute('visible', 'true');
        }
      }

      bLeft.setAttribute('position', `${randX} ${randY} ${baseZ}`);
      bLeft.setAttribute('radius', '1.80');
      bRight.setAttribute('position', `${randX} ${randY} ${baseZ}`);
      bRight.setAttribute('radius', '1.80');

      let localXLeft = (randX - camPos.x) / (zOffset) - 0.03;
      let localXRight = (randX - camPos.x) / (zOffset) + 0.03;
      let localY = (randY - camPos.y) / (zOffset);
      
      ringLeft.setAttribute('position', `${localXLeft} ${localY} -1`);
      ringRight.setAttribute('position', `${localXRight} ${localY} -1`);

      if (secureTrigger) {
        secureTrigger.setAttribute('position', `${randX} ${randY} ${baseZ}`);
        secureTrigger.setAttribute('geometry', `primitive: sphere; radius: 2.5`);
        if (!isPopping && !secureTrigger.classList.contains('gaze-secure-trigger')) secureTrigger.classList.add('gaze-secure-trigger');
      }
    }

    window.checkTargetGazeIntersectionInternal = function() {
      if (!isTrainingActive || isPopping) return;
      const raycasterEl = document.getElementById('centerFixationRay');
      if (!raycasterEl) return;
      let raycasterComponent = raycasterEl.components.raycaster;
      if (raycasterComponent && raycasterComponent.intersections && raycasterComponent.intersections.length > 0) {
        if (!gazeTimer) {
          gazeTimer = setTimeout(() => {
            const secureTrigger = document.getElementById('gaze-collision-trigger');
            if (secureTrigger) secureTrigger.classList.remove('gaze-secure-trigger');
            isPopping = true;
            gazeTimer = null;
            popTargetSuccess();
          }, 1000);
        }
      } else if (gazeTimer) {
        clearTimeout(gazeTimer);
        gazeTimer = null;
      }
    };

    function popTargetSuccess() {
      playPopSound();
      balloonPopCount++; 
      updateHudDisplay(); // 터지는 즉시 상단 카운터 반영
      triggerParticlesEmission(currentX, currentY, currentZ, 30);
      
      if (eyeModeSetting === "alternating") {
        activeTurn = (activeTurn === "left") ? "right" : "left";
      }
      
      document.getElementById('magic-eye-board').setAttribute('visible', 'false');
      setTimeout(() => {
        if (!isTrainingActive) return;
        isPopping = false;
        renderRandomTargetsOnly();
        document.getElementById('magic-eye-board').setAttribute('visible', 'true');
      }, 400);
    }

    window.animateBackgroundScrollInternal = function() {
      if (!isTrainingActive) return;
      
      let currentDir = "right";
      if (runModeSetting === "auto") {
        const dirs = ["right", "left", "up", "down", "clockwise", "counterclockwise"];
        currentDir = dirs[autoDirectionStep];
      } else {
        currentDir = manualDirectionSetting;
      }

      switch(currentDir) {
        case "right": rotY += (rotationSpeed * 0.1); break;
        case "left": rotY -= (rotationSpeed * 0.1); break;
        case "up": rotX -= (rotationSpeed * 0.1); break;
        case "down": rotX += (rotationSpeed * 0.1); break;
        case "clockwise": rotZ += (rotationSpeed * 0.1); break;
        case "counterclockwise": rotZ -= (rotationSpeed * 0.1); break;
      }
      
      const sky = document.getElementById('rotating-bg');
      if (sky) sky.setAttribute('rotation', `${rotX} ${rotY} ${rotZ}`);
    };

    function playPopSound() {
      if (!audioCtx) return;
      try {
        const osc1 = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc1.type = 'sine'; osc1.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc1.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.15, applicationCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc1.connect(gainNode); gainNode.connect(audioCtx.destination);
        osc1.start(); osc1.stop(audioCtx.currentTime + 0.12);
      } catch(e) {}
    }

    function triggerParticlesEmission(x, y, z, count) {
      const pGroup = document.getElementById('particle-group');
      for (let i = 0; i < count; i++) {
        const p = document.createElement('a-box');
        p.setAttribute('width', '0.12'); p.setAttribute('height', '0.12'); p.setAttribute('depth', '0.12');
        p.setAttribute('color', ['#ff0055', '#ffff00', '#00ffcc', '#38bdf8'][Math.floor(Math.random() * 4)]);
        p.setAttribute('position', `${x} ${y} ${z}`);
        const vx = (Math.random() - 0.5) * 6, vy = (Math.random() - 0.5) * 6 + 2.5, vz = (Math.random() - 0.5) * 6;
        pGroup.appendChild(p);
        let age = 0;
        const t = setInterval(() => {
          age += 16;
          p.setAttribute('position', `${x + vx * (age/1000)} ${y + vy * (age/1000) - (0.5 * 9.8 * (age/1000)**2)} ${z + vz * (age/1000)}`);
          if (age > 800) { clearInterval(t); if (p.parentNode) p.parentNode.removeChild(p); }
        }, 16);
      }
    }

    sceneEl.addEventListener('enter-vr', () => {
      const camera = sceneEl.camera;
      if (camera && camera.isArrayCamera) {
        camera.cameras[0].layers.enable(1); camera.cameras[0].layers.disable(2);
        camera.cameras[1].layers.enable(2); camera.cameras[1].layers.disable(1);
      }
    });
  </script>
</body>
</html>
