<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>VR 시기능 훈련 시스템 - 브라우저 전환 대응</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>

  <a-scene background="color: #000000" vr-mode-ui="enabled: true">
    <a-assets>
      <audio id="pop-sound" src="https://actions.google.com/sounds/v1/ui/beep.ogg" preload="auto"></audio>
    </a-assets>

    <a-entity id="sound-entity" sound="src: #pop-sound; volume: 5;"></a-entity>

    <a-entity camera look-controls position="0 1.6 0">
        <a-cursor fuse="true" fuseTimeout="500"></a-cursor>
    </a-entity>

    <a-entity id="rear-score-board" position="0 1.6 3" rotation="0 180 0">
      <a-plane width="2" height="1" color="#111" material="opacity: 0.8"></a-plane>
      <a-text id="score-display" value="점수: 0" align="center" position="0 0 0.1" color="white"></a-text>
    </a-entity>

    <a-sphere id="target" position="0 1.6 -3" radius="0.5" color="red" visible="false"></a-sphere>
    
    <a-sky id="bg" color="#222"></a-sky>
  </a-scene>

  <script>
    let score = 0;
    let isTrainingRunning = false;

    // 브라우저 포커스(전환) 시 훈련 시작/활성화 로직
    window.addEventListener('focus', () => {
      if (!isTrainingRunning) {
        console.log("브라우저 전환 감지: 훈련 활성화");
        isTrainingRunning = true;
        document.getElementById('target').setAttribute('visible', 'true');
        // 여기서 배경 애니메이션 시작 코드 추가
        startAnimation();
      }
    });

    function startAnimation() {
      // 배경 움직임 로직 예시
      let bg = document.getElementById('bg');
      setInterval(() => {
        if(isTrainingRunning) {
          // 배경이 움직이는 로직
          bg.setAttribute('rotation', `0 ${Date.now()/50} 0`);
        }
      }, 100);
    }

    // 풍선 터뜨리기
    document.getElementById('target').addEventListener('click', () => {
      score += 100;
      document.getElementById('score-display').setAttribute('value', '점수: ' + score);
      
      // 사운드 재생 (강제)
      let sound = document.getElementById('sound-entity');
      sound.components.sound.stopSound();
      sound.components.sound.playSound();
      
      // 위치 이동
      document.getElementById('target').setAttribute('position', (Math.random()-0.5)*4 + " 1.6 -3");
    });
  </script>
</body>
</html>
