<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>VR 시기능 훈련 시스템 V16.0 - 수정본</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    /* ... 이전 스타일 동일하게 작성 ... */
  </style>
</head>
<body>

  <a-scene id="scene" background="color: #000000">
    <a-assets>
      <canvas id="bgCheckerCanvas" width="512" height="512"></canvas>
    </a-assets>
    <a-sky id="rotating-bg" src="#bgCheckerCanvas" radius="50" material="shader: flat; repeat: 16 16; side: back;"></a-sky>
    
    <a-entity id="mainCamera" camera look-controls position="0 1.6 0"></a-entity>
    
    <a-entity id="magic-eye-board" visible="true">
      <a-sphere id="balloon-left" color="#ff2a2a" position="0 1.6 -5" radius="0.5"></a-sphere>
    </a-entity>
  </a-scene>

  <script>
    // 1. 배경 그리기 함수를 별도로 분리
    function redrawBackgroundGrid() {
      const bgCanvas = document.getElementById('bgCheckerCanvas');
      const bgCtx = bgCanvas.getContext('2d');
      bgCtx.fillStyle = '#000000';
      bgCtx.fillRect(0, 0, 512, 512);
      bgCtx.fillStyle = '#FFFFFF';
      // ... (기존 격자 그리기 로직) ...
      
      const sky = document.getElementById('rotating-bg');
      if(sky && sky.components.material) {
        sky.components.material.material.map.needsUpdate = true;
      }
    }

    // 2. 훈련 시작 함수: 순서 보장
    function startFusionTraining() {
      // 오디오 활성화
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      // UI 숨김
      document.getElementById('control-panel').style.display = 'none';

      // 씬이 준비된 후 VR 진입
      const sceneEl = document.querySelector('a-scene');
      
      // VR 진입 후 배경 재로딩 보장
      sceneEl.addEventListener('enter-vr', () => {
        setTimeout(redrawBackgroundGrid, 500); // VR 진입 직후 캔버스 강제 업데이트
      }, { once: true });

      sceneEl.enterVR();
    }

    // 초기화 시 배경 그리기
    window.addEventListener('load', redrawBackgroundGrid);
  </script>
</body>
</html>
