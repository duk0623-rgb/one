<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>VR 시기능 훈련 시스템</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Malgun Gothic', sans-serif; }
    
    /* 훈련 시작 버튼을 화면 정중앙에 크게 배치하여 첫 클릭을 유도 */
    #start-btn { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 20px 40px; font-size: 24px; z-index: 100000; 
      background: #22c55e; color: white; border: none; border-radius: 12px; cursor: pointer;
    }

    /* 스코어보드를 아주 우측 끝으로 밀어내고, 조준 방해를 막음 */
    #score-board { 
      position: fixed; top: 10px; right: 0; z-index: 9999;
      background: rgba(0, 0, 0, 0.7); color: white; padding: 10px;
      border-radius: 10px 0 0 10px; border: 1px solid #38bdf8;
      pointer-events: none; /* 조준 방해 방지 */
    }
  </style>
</head>
<body>

  <button id="start-btn" onclick="startFusionTraining()">훈련 시작 (클릭하세요)</button>

  <div id="score-board">
    <div>남은 시간: <span id="val-time">10:00</span></div>
    <div>점수: <span id="val-score">0000</span></div>
  </div>

  <a-scene vr-mode-ui="enabled: true">
    <a-sky id="rotating-bg" color="#000"></a-sky>
    <a-entity id="mainCamera" camera look-controls position="0 1.6 0"></a-entity>
    </a-scene>

  <script>
    function startFusionTraining() {
      // 1. 브라우저 오디오/애니메이션 정책 강제 승인
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
      
      // 2. 버튼 숨기기
      document.getElementById('start-btn').style.display = 'none';

      // 3. VR 진입
      const sceneEl = document.querySelector('a-scene');
      sceneEl.enterVR().then(() => {
        // VR 진입 후 루프 강제 동기화
        isTrainingActive = true;
        animateBackgroundAndScroll();
      });
    }
  </script>
</body>
</html>
