<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시기능 훈련 시스템 - 원상복귀</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>

  <div id="control-panel" style="position:absolute; top:20px; left:20px; z-index:9999; background:#000; color:#fff; padding:20px; border:1px solid #fff;">
    <h3>훈련 설정 제어판</h3>
    <button onclick="startTraining()" style="padding:15px; cursor:pointer;">훈련 시작</button>
  </div>

  <a-scene>
    <a-camera position="0 1.6 0"></a-camera>
    <a-sky color="#000"></a-sky>
    
    <a-sphere id="target" position="0 1.6 -3" radius="0.5" color="red"></a-sphere>
  </a-scene>

  <script>
    function startTraining() {
      // 훈련 시작 시 컨트롤 패널 제거 및 훈련 모드 진입
      document.getElementById('control-panel').style.display = 'none';
      document.querySelector('a-scene').enterVR();
      console.log("훈련 프로그램 초기 상태 복구 완료");
    }
  </script>
</body>
</html>
