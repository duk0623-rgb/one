<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>VR 정밀 주시 유도형 시각격자 자극 시스템 V15.7</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Malgun Gothic', sans-serif; user-select: none; }
    #control-panel {
      position: absolute; top: 15px; left: 15px; z-index: 99999;
      background: rgba(11, 15, 26, 0.96); color: white; padding: 22px;
      border-radius: 12px; border: 1px solid #3b82f6; width: 300px;
      max-height: 90vh; overflow-y: auto;
    }
    .panel-title { font-size: 15px; font-weight: bold; color: #38bdf8; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #3b82f6; padding-bottom: 8px; line-height: 1.4; }
    .panel-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; font-weight: bold; }
    select, input[type="range"] { width: 100%; padding: 8px; background: #1e293b; color: white; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
    .display-value { float: right; color: #38bdf8; font-weight: bold; }
    .btn { width: 100%; padding: 11px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 14px; }
    #start-btn { background: #22c55e; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
    
    #score-board { 
      position: fixed; top: 20px; right: 20px; z-index: 99999; 
      background: rgba(15, 23, 42, 0.95); color: #22c55e; padding: 18px 22px; 
      border-radius: 10px; border: 2px solid #22c55e; font-family: monospace; width: 250px; 
    }
    .score-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 15px; }
    
    /* 주시 고정 타이머 바 */
    #lock-gauge-container { width: 100%; background: #334155; height: 6px; border-radius: 3px; margin-top: 5px; overflow: hidden; display: none; }
    #lock-gauge-bar { width: 0%; height: 100%; background: #eab308; transition: width 0.05s linear; }
    
    #combo-alert { font-size: 15px; font-weight: bold; color: #eab308; text-align: center; margin-top: 5px; min-height: 22px; }
    #fever-indicator { display: none; text-align: center; color: #ff007f; font-weight: bold; font-size: 13px; animation: blink 0.5s infinite alternate; margin-top: 2px; }
    
    @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }
    .exit-vr-btn { width: 100%; background: #ef4444; color: white; border: none; border-radius: 4px; padding: 6px 10px; font-weight: bold; cursor: pointer; font-size: 11px; margin-top: 8px; display: none; }
    #result-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100000; background: rgba(11, 16, 26, 0.98); color: white; padding: 35px 50px; border-radius: 15px; border: 3px solid #38bdf8; text-align: center; }
    #result-modal h1 { color: #38bdf8; margin-top: 0; font-size: 20px; }
    .final-score { font-size: 36px; color: #eab308; margin: 20px 0; font-weight: bold; }
    .reset-btn { background: #38bdf8; color: #000; padding: 10px 25px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="control-panel">
    <div class="panel-title">🎯 정밀 주시 유도형<br>시각격자 자극 시스템 V15.7</div>
    
    <div class="panel-group">
      <label>⏰ 훈련 프로토콜 시간 설정</label>
      <select id="training-time-select">
        <option value="60">1분 (수행도 평가)</option>
        <option value="300">5분 (단기 격자 자극)</option>
        <option value="600" selected>10분 (정밀 주시 자극)</option>
      </select>
    </div>

    <div class="panel-group">
      <label>↔️ 주시 시표 발생 반경 <span class="display-value" id="range-txt">1.40</span></label>
      <input type="range" id="range-slider" min="0.50" max="2.40" value="1.40" step="0.10">
    </div>

    <div class="panel-group" style="border-top: 1px dashed #475569; padding-top: 12px; margin-top: 12px;">
      <label>🔄 배후 격자(OKN) 자극 속도 <span class="display-value" id="bg-speed-txt">3</span></label>
      <input type="range" id="bg-speed-slider" min="1" max="10" value="3" step="1">
    </div>

    <div class="panel-group">
      <label>🧭 배후 격자 운동 패턴</label>
      <select id="bg-mode-select">
        <option value="linear">수평 직선 패턴 (망막 흐름 자극)</option>
        <option value="rotation">축방향 회선 패턴 (회전 격자 자극)</option>
        <option value="auto-mix" selected>직선 ➡️ 회전 자동 교대 자극</option>
      </select>
    </div>

    <div class="panel-group">
      <label>🧠 배후 격자 대비도 설정</label>
      <select id="game-style-select">
        <option value="clinical" selected>표준 격자 모드 (흑백 고대비 패턴)</option>
        <option value="dopamine">🔥 보상 격자 모드 (네온 고대비 패턴)</option>
      </select>
    </div>
    
    <button id="start-btn" class="btn" onclick="startFusionTraining()">▶️ 시각격자 자극 훈련 가동</button>
  </div>

  <div id="score-board">
    <div class="score-row" style="color: #ef4444; font-size: 18px; font-weight: bold;">
      <span>TIME</span><span id="val-time">00:00</span>
    </div>
    <div style="color: #cbd5e1; font-size: 12px; margin-bottom: 6px; font-weight: bold;">
      지정안: <span id="active-eye-txt" style="color:#ff2a2a;">좌안 (적색 주시시표)</span>
    </div>
    <div class="score-row" style="color: #38bdf8;">
      <span>격자 자극 효율</span><span id="val-score">0000</span>
    </div>
    <div class="score-row" style="color: #a855f7; font-size: 13px;">
      <span>주시 원근 거리</span><span id="val-distance">-.-m</span>
    </div>
    
    <!-- 주시 고정 및 배후 자극 동기화 알림 바 -->
    <div style="font-size: 11px; color:#eab308; margin-top:5px; text-align:center;" id="dwell-status-txt">주시 시표에 초점을 고정하세요</div>
    <div id="lock-gauge-container"><div id="lock-gauge-bar"></div></div>
    
    <hr style="border: 0; border-top: 1px solid #22c55e; margin: 8px 0;">
    <div id="combo-alert"></div>
    <div id="fever-indicator">🧠 CORTICAL GRID STIMULATION ACTIVE 🧠</div>
    
    <button id="exit-vr-control" class="exit-vr-btn" onclick="exitVRModeManually()">🔴 자극 훈련 중단 및 복귀</button>
  </div>

  <div id="result-modal">
    <h1>📊 주시성 시각자극 훈련 완료 📊</h1>
    <p style="color: #aaa; margin: 0;">최종 격자 자극 효율 지수</p>
    <div class="final-score"><span id="modal-final-score">0</span> 점</div>
    <button class="reset-btn" onclick="location.reload()">처음으로</button>
  </div>

  <a-scene background="color: #000000" vr-mode-ui="enabled: true">
    <a-assets>
      <canvas id="bgCheckerCanvas" width="512" height="512"></canvas>
    </a-assets>

    <a-sky id="rotating-bg" src="#bgCheckerCanvas" radius="50" material="shader: flat; repeat: 16 16; side: back;" stereo-eye-lock="eye: both"></a-sky>

    <a-entity id="cameraRig">
      <a-entity id="mainCamera" camera look-controls position="0 1.6 0">
        <a-entity id="centerFixationRay" raycaster="objects: .gaze-secure-trigger; far: 100; interval: 10;"></a-entity>
        <a-ring radius-inner="0.02" radius-outer="0.03" color="#ffffff" position="0 0 -1" material="shader: flat; opacity: 0.8; depthTest: false;"></a-ring>
      </a-entity>
    </a-entity>

    <a-entity id="magic-eye-board" visible="true">
      
      <!-- 좌안 격리 레이어 -->
      <a-entity id="left-eye-container" stereo-eye-lock="eye: left">
        <a-entity id="balloon-left">
          <a-cone id="cone-left" radius-top="0.005" color="#cc1111" position="0 -0.2 0"></a-cone>
        </a-entity>
      </a-entity>
      
      <!-- 우안 격리 레이어 -->
      <a-entity id="right-eye-container" stereo-eye-lock="eye: right">
        <a-entity id="balloon-right">
          <a-cone id="cone-right" radius-top="0.005" color="#047857" position="0 -0.2 0"></a-cone>
        </a-entity>
      </a-entity>

      <!-- 정밀 주시 고정용 콜라이더 -->
      <a-entity id="gaze-collision-trigger" class="gaze-secure-trigger" geometry="primitive: sphere;" material="visible: false;" stereo-eye-lock="eye: both"></a-entity>
      
    </a-entity>

    <a-entity id="particle-group"></a-entity>
  </a-scene>

  <script>
    const bgCanvas = document.getElementById('bgCheckerCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const bSize = 512; const bRows = 8; const bCols = 8; 
    const bW = bSize / bCols; const bH = bSize / bRows;
    
    function drawBackgroundGrid(feverStyle) {
      for (let r = 0; r < bRows; r++) {
        for (let c = 0; c < bCols; c++) {
          if (feverStyle) {
            bgCtx.fillStyle = ((r + c) % 2 === 0) ? '#2e1065' : '#ff007f'; 
          } else {
            bgCtx.fillStyle = ((r + c) % 2 === 0) ? '#FFFFFF' : '#000000'; 
          }
          bgCtx.fillRect(c * bW, r * bH, bW, bH);
        }
      }
      const sky = document.getElementById('rotating-bg');
      if(sky && sky.object3DMap.mesh) sky.object3DMap.mesh.material.map.needsUpdate = true;
    }
    drawBackgroundGrid(false);

    let audioCtx = null; let score = 0; let randomRange = 1.40; 
    let baseSpeedParam = 3; let bgAngleX = 0; let bgAngleZ = 0; 
    let isTrainingActive = false; let isPopping = false; 

    let gazeHoldStartTime = null;
    const VISUAL_DWELL_REQUIRED = 800; // 0.8초 고정 주시 유도 시간
    let isGazeIntersecting = false;

    let comboCount = 0;
    let isFeverActive = false;
    let shapeRotation = 0;
    
    let currentMotionType = "linear"; 
    let motionAlternator = 0;

    let elapsedInterval = null; let totalSecondsElapsed = 0; let targetSeconds = 600;      
    let activeTurn = "left"; 
    let currentX = 0, currentY = 1.6, currentZ = -3.5;
    let currentShapeType = "sphere";

    const shapeColors = ['#ff2a2a', '#eab308', '#38bdf8', '#a855f7', '#ff4500', '#00ffcc'];
    const shapeNames = ['구체형 주시시표', '환형 주시시표', '입방체 주시시표', '원뿔형 주시시표'];
    let currentThemeColor = '#ff2a2a';

    document.getElementById('range-slider').addEventListener('input', (e) => {
      randomRange = parseFloat(e.target.value);
      document.getElementById('range-txt').innerText = randomRange.toFixed(2);
      if(isTrainingActive) { renderAlternatingTargets(); }
    });
    document.getElementById('bg-speed-slider').addEventListener('input', (e) => {
      baseSpeedParam = parseInt(e.target.value);
      document.getElementById('bg-speed-txt').innerText = baseSpeedParam;
    });

    function renderAlternatingTargets() {
      if (!isTrainingActive) return;

      const cameraEl = document.getElementById('mainCamera');
      let camPos = {x: 0, y: 1.6, z: 0};
      if (cameraEl && cameraEl.object3D) {
        camPos.x = cameraEl.object3D.position.x;
        camPos.y = cameraEl.object3D.position.y;
        camPos.z = cameraEl.object3D.position.z;
      }

      let randomZDepth = 1.6 + (Math.random() * 3.2); 
      document.getElementById('val-distance').innerText = randomZDepth.toFixed(1) + "m";
      let baseZ = camPos.z - randomZDepth; 

      let distanceScaleFactor = randomZDepth / 3.5; 
      let randX = camPos.x + (Math.random() - 0.5) * (randomRange * 2.2 * distanceScaleFactor);
      let randY = camPos.y + (Math.random() - 0.5) * (randomRange * 1.6 * distanceScaleFactor); 

      if (randY < camPos.y - 0.8) randY = camPos.y - 0.8;
      if (randY > camPos.y + 1.1) randY = camPos.y + 1.1;

      currentX = randX; currentY = randY; currentZ = baseZ;
      let finalRadius = 0.23 * distanceScaleFactor;
      if(finalRadius < 0.13) finalRadius = 0.13;

      const shapes = ["sphere", "torus", "box", "cone"];
      const rIndex = Math.floor(Math.random() * shapes.length);
      currentShapeType = shapes[rIndex];
      
      currentThemeColor = shapeColors[Math.floor(Math.random() * shapeColors.length)];

      let geoOptions = "";
      if(currentShapeType === "torus") geoOptions = `; radius: ${finalRadius * 0.7}; radiusTubular: 0.05;`;
      else if(currentShapeType === "box") geoOptions = `; width: ${finalRadius*1.4}; height: ${finalRadius*1.4}; depth: ${finalRadius*1.4};`;
      else if(currentShapeType === "cone") geoOptions = `; radiusBottom: ${finalRadius}; height: ${finalRadius*1.6};`;
      else geoOptions = `; radius: ${finalRadius};`;

      const bLeft = document.getElementById('balloon-left');
      const bRight = document.getElementById('balloon-right');
      const secureTrigger = document.getElementById('gaze-collision-trigger');
      const cLeft = document.getElementById('left-eye-container');
      const cRight = document.getElementById('right-eye-container');

      const eyeColorText = (activeTurn === "left") ? "좌안 차폐해제" : "우안 차폐해제";
      document.getElementById('active-eye-txt').innerText = `${eyeColorText} [${shapeNames[rIndex]}]`;
      document.getElementById('active-eye-txt').style.color = currentThemeColor;

      if (activeTurn === "left") {
        cLeft.setAttribute('visible', 'true'); cRight.setAttribute('visible', 'false');
        bLeft.setAttribute('geometry', `primitive: ${currentShapeType}${geoOptions}`);
        bLeft.setAttribute('position', `${randX} ${randY} ${baseZ}`);
        bLeft.setAttribute('material', `color: ${currentThemeColor}; roughness: 0.18; flatShading: true;`);
      } 
      else {
        cLeft.setAttribute('visible', 'false'); cRight.setAttribute('visible', 'true');
        bRight.setAttribute('geometry', `primitive: ${currentShapeType}${geoOptions}`);
        bRight.setAttribute('position', `${randX} ${randY} ${baseZ}`);
        bRight.setAttribute('material', `color: ${currentThemeColor}; roughness: 0.18; flatShading: true;`);
      }

      if (secureTrigger) {
        secureTrigger.setAttribute('position', `${randX} ${randY} ${baseZ}`);
        let triggerRadius = 0.35 * distanceScaleFactor;
        if(triggerRadius < 0.26) triggerRadius = 0.26; 
        secureTrigger.setAttribute('geometry', `primitive: sphere; radius: ${triggerRadius}`);
        if (!secureTrigger.classList.contains('gaze-secure-trigger')) {
          secureTrigger.classList.add('gaze-secure-trigger');
        }
      }
      
      isGazeIntersecting = false;
      gazeHoldStartTime = null;
      document.getElementById('lock-gauge-bar').style.width = "0%";
    }

    function setupVRHardwareLayers() {
      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener('enter-vr', () => {
        const camera = sceneEl.camera;
        if (camera && camera.isArrayCamera) {
          camera.cameras[0].layers.enable(1); camera.cameras[0].layers.disable(2);
          camera.cameras[1].layers.enable(2); camera.cameras[1].layers.disable(1);
        }
      });
    }

    function checkTargetGazeIntersection() {
      requestAnimationFrame(checkTargetGazeIntersection);
      if (!isTrainingActive || isPopping) return; 

      const raycasterEl = document.getElementById('centerFixationRay');
      if (!raycasterEl) return;

      let raycasterComponent = raycasterEl.components.raycaster;
      
      if (raycasterComponent && raycasterComponent.intersections && raycasterComponent.intersections.length > 0) {
        if (!isGazeIntersecting) {
          isGazeIntersecting = true;
          gazeHoldStartTime = performance.now(); 
          document.getElementById('lock-gauge-container').style.display = 'block';
          document.getElementById('dwell-status-txt').innerText = "🔬 주시 고정 및 배후 격자 자극 동기화 중...";
          document.getElementById('dwell-status-txt').style.color = "#eab308";
        } else {
          let duration = performance.now() - gazeHoldStartTime;
          let percent = Math.min((duration / VISUAL_DWELL_REQUIRED) * 100, 100);
          document.getElementById('lock-gauge-bar').style.width = percent + "%";

          if (duration >= VISUAL_DWELL_REQUIRED) {
            const secureTrigger = document.getElementById('gaze-collision-trigger');
            if (secureTrigger) { secureTrigger.classList.remove('gaze-secure-trigger'); }
            isPopping = true;
            popTargetSuccess();
          }
        }
      } else {
        if (isGazeIntersecting) {
          isGazeIntersecting = false;
          gazeHoldStartTime = null;
          document.getElementById('lock-gauge-bar').style.width = "0%";
          document.getElementById('dwell-status-txt').innerText = "❌ 주시 유실! 격자 자극이 중단되었습니다.";
          document.getElementById('dwell-status-txt').style.color = "#ef4444";
        }
      }
    }

    function popTargetSuccess() {
      comboCount++;
      motionAlternator++;
      
      const selectedGameStyle = document.getElementById('game-style-select').value;
      
      if (selectedGameStyle === "dopamine" && comboCount >= 5) {
        if(!isFeverActive) {
          isFeverActive = true;
          document.getElementById('fever-indicator').style.display = 'block';
          document.getElementById('score-board').style.borderColor = '#ff007f';
          document.getElementById('score-board').style.color = '#ff007f';
          drawBackgroundGrid(true);
        }
        document.getElementById('combo-alert').innerText = `⚡ 연속 격자자극 동기화: ${comboCount}회`;
        score += 2500;
      } else {
        document.getElementById('combo-alert').innerText = `👍 주시성 격자 자극 매칭 성공 (${comboCount}연속)`;
        score += 1000;
      }
      
      playPopSound(isFeverActive); 
      document.getElementById('val-score').innerText = score.toString().padStart(4, '0');
      triggerParticlesEmission(currentX, currentY, currentZ, isFeverActive ? 45 : 15);
      
      activeTurn = (activeTurn === "left") ? "right" : "left";

      const bgSelectMode = document.getElementById('bg-mode-select').value;
      if (bgSelectMode === "auto-mix") {
        currentMotionType = (motionAlternator % 2 === 0) ? "linear" : "rotation";
      } else {
        currentMotionType = bgSelectMode;
      }

      document.getElementById('magic-eye-board').setAttribute('visible', 'false');
      document.getElementById('lock-gauge-container').style.display = 'none';

      setTimeout(() => {
        if (!isTrainingActive) return;
        isPopping = false;
        renderAlternatingTargets(); 
        document.getElementById('magic-eye-board').setAttribute('visible', 'true'); 
      }, 500); 
    }

    function animateBackground() {
      requestAnimationFrame(animateBackground);
      if (isTrainingActive) {
        let oknVelocity = baseSpeedParam * 0.003;
        if (isFeverActive) oknVelocity *= 1.5; 

        const sky = document.getElementById('rotating-bg');
        if (sky) {
          if (currentMotionType === "linear") {
            bgAngleX += oknVelocity;
            sky.setAttribute('rotation', `0 ${bgAngleX * 57.3} 0`);
          } else {
            bgAngleZ += oknVelocity;
            sky.setAttribute('rotation', `0 0 ${bgAngleZ * 57.3}`);
          }
        }

        shapeRotation += 0.6;
        const bLeft = document.getElementById('balloon-left');
        const bRight = document.getElementById('balloon-right');
        if(bLeft) bLeft.setAttribute('rotation', `${shapeRotation} ${shapeRotation} 0`);
        if(bRight) bRight.setAttribute('rotation', `${shapeRotation} ${shapeRotation} 0`);
      }
    }

    function startElapsedClock() {
      if (elapsedInterval) clearInterval(elapsedInterval);
      totalSecondsElapsed = 0;
      
      elapsedInterval = setInterval(() => {
        if (!isTrainingActive) return;
        totalSecondsElapsed++;
        let min = Math.floor(totalSecondsElapsed / 60); let sec = totalSecondsElapsed % 60;
        document.getElementById('val-time').innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        if (totalSecondsElapsed >= targetSeconds) { clearInterval(elapsedInterval); playFanfareAndFinish(); }
      }, 1000);
    }

    function playFanfareAndFinish() {
      isTrainingActive = false;
      document.getElementById('magic-eye-board').setAttribute('visible', 'false');
      document.getElementById('exit-vr-control').style.display = 'none';
      
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, index) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
          osc.connect(gainNode); gainNode.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }, index * 100);
      });

      setTimeout(() => {
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl && sceneEl.is('vr-mode')) sceneEl.exitVR();
        document.getElementById('modal-final-score').innerText = score;
        document.getElementById('result-modal').style.display = 'block';
      }, 1200);
    }

    function playPopSound(fever) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
      osc.type = fever ? 'triangle' : 'sine';
      let pitch = fever ? 550 + (comboCount * 25) : 400 + (comboCount * 20);
      if(pitch > 1300) pitch = 1300;
      osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
      gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.connect(gainNode); gainNode.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.12);
    }

    function triggerParticlesEmission(x, y, z, count) {
      const pGroup = document.getElementById('particle-group');
      for (let i = 0; i < count; i++) {
        const p = document.createElement('a-box');
        p.setAttribute('width', '0.03'); p.setAttribute('height', '0.03'); p.setAttribute('depth', '0.03');
        p.setAttribute('color', currentThemeColor); 
        p.setAttribute('position', `${x} ${y} ${z}`);
        
        const vx = (Math.random() - 0.5) * 3.5; const vy = (Math.random() - 0.5) * 3.5 + 1.2; const vz = (Math.random() - 0.5) * 3.5;
        pGroup.appendChild(p);
        let age = 0;
        const t = setInterval(() => {
          age += 16;
          let cx = x + vx * (age/1000); let cy = y + vy * (age/1000) - (0.5 * 9.8 * (age/1000)*(age/1000)); let cz = z + vz * (age/1000);
          p.setAttribute('position', `${cx} ${cy} ${cz}`);
          if (age > 700) { clearInterval(t); if (p.parentNode) p.parentNode.removeChild(p); }
        }, 16);
      }
    }

    function exitVRModeManually() {
      isTrainingActive = false; isPopping = false; comboCount = 0; isFeverActive = false;
      drawBackgroundGrid(false);
      if (elapsedInterval) clearInterval(elapsedInterval);
      document.getElementById('magic-eye-board').setAttribute('visible', 'false');
      document.getElementById('control-panel').style.display = 'block';
      document.getElementById('exit-vr-control').style.display = 'none';
      document.getElementById('fever-indicator').style.display = 'none';
      document.getElementById('lock-gauge-container').style.display = 'none';
      document.getElementById('score-board').style.borderColor = '#22c55e';
      document.getElementById('score-board').style.color = '#22c55e';
      document.getElementById('combo-alert').innerText = "";
      const sceneEl = document.querySelector('a-scene');
      if (sceneEl && sceneEl.is('vr-mode')) sceneEl.exitVR();
    }

    function startFusionTraining() {
      isTrainingActive = true; isPopping = false; comboCount = 0; isFeverActive = false;
      document.getElementById('combo-alert').innerText = "";
      document.getElementById('fever-indicator').style.display = 'none';
      document.getElementById('score-board').style.borderColor = '#22c55e';
      document.getElementById('score-board').style.color = '#22c55e';
      
      const bgSelectMode = document.getElementById('bg-mode-select').value;
      if (bgSelectMode === "auto-mix") currentMotionType = "linear";
      else currentMotionType = bgSelectMode;

      drawBackgroundGrid(false);

      targetSeconds = parseInt(document.getElementById('training-time-select').value);
      baseSpeedParam = parseInt(document.getElementById('bg-speed-slider').value);

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      document.getElementById('control-panel').style.display = 'none';
      document.getElementById('exit-vr-control').style.display = 'block';
      
      activeTurn = "left"; 
      document.getElementById('magic-eye-board').setAttribute('visible', 'true');
      renderAlternatingTargets(); 
      startElapsedClock();
      
      const sceneEl = document.querySelector('a-scene');
      if (sceneEl.hasLoaded) { sceneEl.enterVR(); } else { sceneEl.addEventListener('loaded', () => { sceneEl.enterVR(); }); }
    }

    setupVRHardwareLayers();
    animateBackground();
    requestAnimationFrame(checkTargetGazeIntersection);
  </script>
</body>
</html>
