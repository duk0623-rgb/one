<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>VR 시기능 훈련 시스템 V16.1</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Malgun Gothic', sans-serif; user-select: none; }
    #control-panel { position: absolute; top: 15px; left: 15px; z-index: 99999; background: rgba(11, 15, 26, 0.95); color: white; padding: 20px; border-radius: 12px; border: 1px solid #3b82f6; width: 310px; }
    .center-title { font-size: 16px; font-weight: bold; color: #38bdf8; text-align: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #3b82f6; }
    .panel-group { margin-bottom: 12px; background: rgba(30, 41, 59, 0.5); padding: 10px; border-radius: 8px; }
    label { display: block; margin-bottom: 6px; font-size: 12px; color: #cbd5e1; font-weight: bold; }
    select, input[type="range"] { width: 100%; padding: 6px; background: #1e293b; color: white; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; font-size: 12px; }
    .btn { width: 100%; padding: 10px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; background: #22c55e; }
    #score-board { position: fixed; top: 20px; right: 20px; z-index: 99999; background: rgba(15, 23, 42, 0.95); color: #fff; padding: 15px; border-radius: 10px; border: 2px solid #38bdf8; width: 280px; }
    .history-container { margin-top: 10px; background: #0f172a; height: 180px; overflow-y: auto; padding: 5px; font-family: monospace; font-size: 11px; }
  </style>
</head>
<body>

  <div id="control-panel">
    <div class="center-title">한국시기능훈련센터 성서계명대점</div>
    <div class="panel-group">
      <label>⏱️ 훈련 시간</label>
      <select id="training-time-select"><option value="60">1분</option><option value="600" selected>10분</option></select>
    </div>
    <div class="panel-group">
      <label>👁️ 안구 모드</label>
      <select id="eye-mode-select"><option value="alternating" selected>양안 융합 (OU)</option><option value="leftOnly">좌안 (L)</option><option value="rightOnly">우안 (R)</option></select>
    </div>
    <button id="start-btn" class="btn" onclick="initAndStartTraining()">▶️ 훈련 시작</button>
  </div>

  <div id="score-board">
    <div>점수: <span id="val-score" style="color:#22c55e;">0000</span></div>
    <div class="history-container" id="history-log"></div>
  </div>

  <a-scene background="color: #000000" vr-mode-ui="enabled: true">
    <a-sky id="rotating-bg" color="#111"></a-sky>
    <a-entity id="mainCamera" camera look-controls position="0 1.6 0">
      <a-entity id="centerFixationRay" raycaster="objects: .gaze-secure-trigger; far: 100;"></a-entity>
    </a-entity>
    <a-entity id="magic-eye-board" visible="false">
      <a-sphere id="balloon" position="0 1.6 -5" radius="0.5" color="#ff2a2a" class="gaze-secure-trigger"></a-sphere>
    </a-entity>
  </a-scene>

  <script>
    let audioCtx = null;
    let isTrainingActive = false;

    // 1. 오디오 컨텍스트를 클릭 시점에 생성하여 브라우저 제한 해결
    function initAndStartTraining() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      isTrainingActive = true;
      document.getElementById('control-panel').style.display = 'none';
      
      const sceneEl = document.querySelector('a-scene');
      
      // VR 진입 성공 시점에서 훈련 로직 시작
      sceneEl.addEventListener('enter-vr', () => {
        document.getElementById('magic-eye-board').setAttribute('visible', 'true');
        console.log("훈련 시작됨");
      }, { once: true });

      sceneEl.enterVR();
    }

    // 초기화 함수
    window.addEventListener('load', () => {
       console.log("시스템 준비 완료");
    });
  </script>
</body>
</html>
